<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23fafafa'/%3E%3C/svg%3E">
    <title>Page Not Found | Nathan Ferdwiansyah W.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/portofolio/projects/case-study.css">
</head>
<body>
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme');
                if (!theme) {
                    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                if (theme === 'light') document.body.classList.add('light-theme');
            } catch (e) { }
        })();
    </script>

    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
        <a class="back-link" href="/portofolio/">&larr; Back to portfolio</a>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to light theme">
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
            </svg>
        </button>
    </header>

    <main id="main">
        <p class="eyebrow">Error 404</p>
        <h1>Page not found.</h1>
        <p class="lede">The page you are looking for does not exist or has moved. Try the portfolio home or jump straight to the projects.</p>

        <div class="cta-row">
            <a class="btn btn-primary" href="/portofolio/">Back to home</a>
            <a class="btn btn-secondary" href="/portofolio/#projects">View projects</a>
            <a class="btn btn-secondary" href="/portofolio/#contact">Contact</a>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Nathan Ferdwiansyah W.</p>
    </footer>

    <script>
        (function () {
            var toggle = document.getElementById('theme-toggle');
            var setLabel = function () {
                var light = document.body.classList.contains('light-theme');
                toggle.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
            };

            setLabel();
            toggle.addEventListener('click', function () {
                var light = document.body.classList.toggle('light-theme');
                localStorage.setItem('theme', light ? 'light' : 'dark');
                setLabel();
            });
        })();
    </script>
</body>
</html>
